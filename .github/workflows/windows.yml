name: windows

# The app only ships for Windows and is developed on macOS, so this is the check that the
# cfg(windows) code (junctions, registry, zip install, CREATE_NO_WINDOW) compiles, and it builds
# the installers. Pushing a v* tag, or running it by hand with a release tag, also attaches the
# installers to that GitHub release (a draft is created if there is none yet).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the installers to (e.g. v0.2.0)
        required: true

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    # Writing release assets needs contents: write; nothing else here writes to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (TS)
        run: bunx vitest run

      # tauri-build checks that the externalBin exists, so the sidecar must be built first.
      - name: Build sidecar
        run: bun run sidecar

      # No `cargo test` here: it compiles everything again in the debug profile, about as long as
      # the release build itself. The build still compiles the cfg(windows) code; run the Rust
      # tests locally with `cargo test --workspace --manifest-path src-tauri/Cargo.toml`.
      - name: Build installers
        run: bun tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Same files as the artifact, straight onto the release, so they never pass through a
      # local machine. --clobber replaces files of the same name (a re-run updates both).
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Workshop Downloader ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber
          gh release view "$TAG" --json isDraft,url,assets --jq '{draft: .isDraft, url: .url, assets: [.assets[] | {name, size}]}'
