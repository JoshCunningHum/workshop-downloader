[package]
name = "fswatch"
version = "0.1.0"
edition = "2024"
# Workspace root lives in src-tauri/ (not an ancestor dir), so point at it explicitly.
workspace = "../../src-tauri"

[dependencies]
jwalk = "0.9.0"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
